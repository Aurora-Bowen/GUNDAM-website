<!DOCTYPE html>

<html lang="{{ site.lang | default: 'en-US' }}">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  >

  <script
    src="{{ '/assets/js/navigation.js' | relative_url }}"
    defer
  ></script>

</head>


<body>

  {% include header.html %}

  <main class="site-main">

    <div class="site-container page-content">

      {{ content }}

    </div>

  </main>

  {% include footer.html %}

</body>

</html>
